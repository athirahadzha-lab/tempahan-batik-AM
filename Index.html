  <section class="form">
    <div class="header">
      <h1>Maklumat Tempahan</h1>
      <p>Sila lengkapkan maklumat untuk membuat tempahan kain batik.</p>
    </div>
    <form id="f">
      <div class="grid">
        <div><label>1. Nama Penerima *</label><input id="name" required placeholder="Contoh: Siti Aminah"></div>
        <div><label>2. No. Telefon *</label><input id="phone" required inputmode="tel" placeholder="Contoh: 0123456789"></div>
        <div><label>3. Ameerah Negeri *</label><select id="state" required><option value="">Pilih Negeri</option><option>Johor</option>
<option>Kedah</option>
<option>Kelantan</option>
<option>Melaka</option>
<option>Negeri Sembilan</option>
<option>Pahang</option>
<option>Perak</option>
<option>Perlis</option>
<option>Pulau Pinang</option>
<option>Sabah</option>
<option>Sarawak</option>
<option>Selangor</option>
<option>Terengganu</option>
<option>W.P. Kuala Lumpur</option>
<option>W.P. Putrajaya</option>
<option>W.P. Labuan</option></select></div>
        <div><label>4. Bilangan Order *</label><input id="qty" required type="number" min="1" value="1"></div>
      </div>
      <div class="total"><span>Jumlah Harga<br><small>RM130 × bilangan order</small></span><strong id="total">RM130</strong></div>
      <button type="submit">📲 HANTAR TEMPAHAN MELALUI WHATSAPP</button>
      <p class="note">Tempahan akan dihantar terus ke WhatsApp 010-869 7187.</p>
    </form>
  </section>
</div>
<script>
const PRICE=130, WA="60108697187";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzZf1oGVPZhb6T3O3Ype5dec2xSNlN41FNq9kpebke0vle1jHeFPapOmodgY2lwROlt/exec";
const qty=document.getElementById("qty"), total=document.getElementById("total");
function update(){total.textContent="RM"+(Math.max(1,parseInt(qty.value||1))*PRICE).toLocaleString("ms-MY");}
qty.addEventListener("input",update); update();
document.getElementById("f").addEventListener("submit",e=>{
 e.preventDefault();
 const q=Math.max(1,parseInt(qty.value||1)), amount=q*PRICE;
 const id="AM-"+Date.now().toString().slice(-6);
 const msg=`🌺 TEMPAHAN KAIN BATIK RASMI AMEERAH MALAYSIA

No. Tempahan: ${id}
Nama Penerima: ${document.getElementById("name").value}
No. Telefon: ${document.getElementById("phone").value}
Ameerah Negeri: ${document.getElementById("state").value}
Bilangan Order: ${q} helai
Harga: RM130 / helai
Jumlah: RM${amount}

Terima kasih atas tempahan.`;
 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const state=document.getElementById("state").value;

 // Hantar data ke Google Sheets melalui Apps Script menggunakan hidden form/iframe.
 const iframe=document.createElement("iframe");
 iframe.name="sheetSubmitFrame"; iframe.style.display="none";
 document.body.appendChild(iframe);
 const form=document.createElement("form");
 form.method="POST"; form.action=SCRIPT_URL; form.target="sheetSubmitFrame"; form.style.display="none";
 const fields={order_id:id,name:name,phone:phone,state:state,qty:q,total:amount};
 Object.entries(fields).forEach(([key,value])=>{
   const input=document.createElement("input"); input.type="hidden"; input.name=key; input.value=value; form.appendChild(input);
 });
 document.body.appendChild(form);
 form.submit();
 setTimeout(()=>{form.remove();iframe.remove();},5000);
window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
});
</script>
